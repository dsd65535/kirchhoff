[project]
name = "kirchhoff"
version = "0.1.0"
description = "A lightweight circuit simulator"
readme = "README.md"
authors = [
    { name = "Dimitar Dimitrov", email = "dimitar.dimitrov@cba.mit.edu" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
kirchhoff = "kirchhoff:main"

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "packages/netlist",
    "packages/lti",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "ipython>=9.10.0",
    "mypy>=1.19.1",
    "pylint>=4.0.5",
    "reorder-python-imports>=3.16.0",
]
